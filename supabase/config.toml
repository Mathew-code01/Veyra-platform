# Local Supabase configuration (Phase 2 foundation)
#
# This file configures the local Supabase CLI for development.
# Ports are used only when running supabase start locally;
# they do not affect the linked remote project.

[api]
port = 54321

[db]
port = 54322

[studio]
port = 54323

[local_smtp]
port = 54324

# Project reference is obtained from the Supabase dashboard after project creation.
# project_ref = "<project-ref>"
